name: Build Tests

on:
  push:
    branches:
      - main
      - develop
      - release-*
      - gh-workflows
  pull_request:
    branches:
      - main
      - develop

env:
  PLATFORM: posix
  TESTS: yes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENHITLS_REPO: https://gitcode.com/openHiTLS/openhitls.git
  # Pinned until the next openHiTLS release
  OPENHITLS_REF: 2d524d8e0f9c392a4bc3c244f976a69f9f6bb64a
  # Keep in sync with examples/contiki/Makefile
  WITH_CONTIKI_NG_BRANCH: release/v5.2
  # Keep in sync with examples/lwip/Makefile
  WITH_LWIP_BRANCH: STABLE-2_2_1_RELEASE
  # Keep in sync with examples/zephyr/Makefile
  WITH_ZEPHYR_BRANCH: v4.3.0

jobs:
  do-caches:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install west
        run: |
          pip3 install --user -U west
      - name: cache openHiTLS
        id: cache_openhitls
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openhitls-prefix
          key: openhitls-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENHITLS_REF }}-full
          lookup-only: true
      - name: build openHiTLS
        if: steps.cache_openhitls.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/openhitls-src" "$RUNNER_TEMP/openhitls-prefix"
          git init "$RUNNER_TEMP/openhitls-src"
          cd "$RUNNER_TEMP/openhitls-src"
          git remote add origin "$OPENHITLS_REPO"
          git fetch --depth 1 origin "$OPENHITLS_REF"
          git checkout FETCH_HEAD
          cmake -S . -B build -DHITLS_BUILD_PROFILE=full -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          cmake --install build --prefix "$RUNNER_TEMP/openhitls-prefix"
      - name: cache Contiki
        id: cache_contiki_ng
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/contiki-ng
          key: contiki-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_CONTIKI_NG_BRANCH }}-full
          lookup-only: true
      - name: download Contiki
        if: steps.cache_contiki_ng.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/download/contiki-ng"
          mkdir -p "$RUNNER_TEMP/download"
          cd "$RUNNER_TEMP/download"
          git clone --depth 1 https://github.com/contiki-ng/contiki-ng.git -b $WITH_CONTIKI_NG_BRANCH
          cd contiki-ng
          git checkout "$WITH_CONTIKI_NG_BRANCH"
      - name: cache LwIP
        id: cache_lwip
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/lwip
          key: lwip-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_LWIP_BRANCH }}-full
          lookup-only: true
      - name: download LwIP
        if: steps.cache_lwip.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/download/lwip"
          mkdir -p "$RUNNER_TEMP/download"
          cd "$RUNNER_TEMP/download"
          git clone --depth 1 https://git.savannah.nongnu.org/git/lwip.git -b $WITH_LWIP_BRANCH
          cd lwip
          git checkout "$WITH_LWIP_BRANCH"
      - name: cache Zephyr
        id: cache_zephyr
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/zephyrproject
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_ZEPHYR_BRANCH }}-full
          lookup-only: true
      - name: download Zephyr
        if: steps.cache_zephyr.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/download/zephyrproject"
          mkdir -p "$RUNNER_TEMP/download"
          cd "$RUNNER_TEMP/download"
          python3 -m venv zephyrproject/.venv
          . zephyrproject/.venv/bin/activate
          pip install west
          west init --mr ${WITH_ZEPHYR_BRANCH} zephyrproject
          cd zephyrproject
          west update -n
          west zephyr-export
          west packages pip --install
          cd zephyr
          west sdk install --install-base=zephyrproject/../ -t x86_64-zephyr-elf
          cd ../../
          deactivate

  other-build:
    needs: do-caches
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        OS: ["zephyr"]
    steps:
      - uses: actions/checkout@v6
      - name: setup
        run: |
          sudo apt-get update && sudo apt-get install -y libc6-dev-i386 lib32stdc++-13-dev
      - name: cache Contiki
        if: matrix.OS == 'contiki'
        id: cache_contiki_ng
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/contiki-ng
          key: contiki-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_CONTIKI_NG_BRANCH }}-full
      - name: install Contiki
        if: matrix.OS == 'contiki'
        run: |
          (cd "$RUNNER_TEMP/download/contiki-ng" ; git describe --tags --all)
          rm -f examples/contiki/contiki-ng
          mkdir -p examples/contiki
          cp -a $RUNNER_TEMP/download/contiki-ng examples/contiki
          cd examples/contiki/contiki-ng/os/net/app-layer && rm -rf libcoap && ln -s ../../../../../.. libcoap
      - name: cache LwIP
        if: matrix.OS == 'lwip'
        id: cache_lwip
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/lwip
          key: lwip-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_LWIP_BRANCH }}-full
      - name: install LwIP
        if: matrix.OS == 'lwip'
        run: |
          (cd "$RUNNER_TEMP/download/lwip" ; git describe --tags --all)
          rm -f examples/lwip/lwip
          mkdir -p examples/lwip
          cp -a $RUNNER_TEMP/download/lwip examples/lwip
      - name: cache Zephyr
        if: matrix.OS == 'zephyr'
        id: cache_zephyr
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/download/zephyrproject
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ env.WITH_ZEPHYR_BRANCH }}-full
      - name: install Zephyr
        if: matrix.OS == 'zephyr'
        run: |
          rm -f examples/zephyr/zephyrproject
          ln -s $RUNNER_TEMP/download/zephyrproject examples/zephyr/zephyrproject
          ls -ld $RUNNER_TEMP/download/zephyrproject examples/zephyr/zephyrproject
      - name: compile
        run: |
          make -C examples/${{matrix.OS}} EXTRA_CFLAGS=-Werror
